plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mkr.crossprofile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mkr.crossprofile'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.3"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            // অপ্রয়োজনীয় কোড মুছে সাইজ কমানো (R8 / ProGuard)
            minifyEnabled true
            
            // অপ্রয়োজনীয় রিসোর্স (ড্রয়েবল, লেআউট ইত্যাদি) বাদ দেওয়া
            shrinkResources true
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // ইমেজ থাম্বনেইল ও প্রিভিউ লোড করার জন্য Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
